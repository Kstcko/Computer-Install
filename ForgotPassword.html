<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน | Install</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
    <link href="css/login.css?v=3" rel="stylesheet">
</head>
<body class="a-page">
    <main class="a-box">
        <a class="a-back" href="Login.html"><i class="bi bi-arrow-left"></i><span>กลับเข้าสู่ระบบ</span></a>
        <div class="a-brand">Install<span>.</span></div>
        <h1>ลืมรหัสผ่าน?</h1>
        <p class="a-sub">กรอกอีเมลที่ใช้เข้าสู่ระบบ แล้วเราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่</p>
        <form id="forgotPasswordForm" class="a-form">
            <div class="a-field">
                <label for="recoveryEmail">อีเมล</label>
                <input id="recoveryEmail" name="email" type="email" autocomplete="email" required>
            </div>
            <button type="submit" class="btn btn-primary a-submit">ส่งลิงก์ตั้งรหัสผ่าน</button>
            <p id="forgotPasswordError" class="a-error" role="alert" aria-live="polite"></p>
            <p id="forgotPasswordSuccess" class="a-success" role="status" aria-live="polite" hidden>
                หากอีเมลนี้มีบัญชี ระบบจะส่งลิงก์ตั้งรหัสผ่านใหม่ให้
            </p>
        </form>
    </main>
    <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
