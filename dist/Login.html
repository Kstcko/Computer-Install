<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | Install</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script type="module" crossorigin src="/Computer-Install/assets/login-DWMgttxh.js"></script>
  <link rel="modulepreload" crossorigin href="/Computer-Install/assets/supabase-DfUQ_Pyo.js">
  <link rel="modulepreload" crossorigin href="/Computer-Install/assets/auth-DNlKMCeC.js">
  <link rel="stylesheet" crossorigin href="/Computer-Install/assets/login-_pAZ2wAB.css">
  <link rel="stylesheet" crossorigin href="/Computer-Install/assets/custom-ClLX-iwM.css">
</head>

<body class="a-page">
    <main class="a-box">
        <a class="a-back" href="index.html" aria-label="ย้อนกลับไปหน้าแรก"><i class="bi bi-arrow-left"></i><span>ย้อนกลับ</span></a>
        <div class="a-brand">Install<span>.</span></div>
        <h1>เข้าสู่ระบบ</h1>
        <p class="a-sub">กรุณาเข้าสู่ระบบเพื่อจัดการงานของคุณ</p>

        <form id="loginForm" class="a-form" novalidate>
            <div class="a-field">
                <label for="email">อีเมล</label>
                <input id="email" name="email" type="email" placeholder="name@rayong-oa.com" required>
                <small class="a-hint">ใช้อีเมล @rayong-oa.com (บัญชี Developer ใช้อีเมลที่กำหนดไว้)</small>
            </div>
            <div class="a-field">
                <div class="a-label">
                    <label for="password">รหัสผ่าน</label>
                    <a id="forgotPasswordLink" href="ForgotPassword.html">ลืมรหัสผ่าน?</a>
                </div>
                <input id="password" name="password" type="password" placeholder="กรอกรหัสผ่านของคุณ" required>
            </div>
            <p class="a-remember">การจัดการ Session ใช้ Supabase Auth</p>
            <button type="submit" class="btn btn-primary a-submit">เข้าสู่ระบบ</button>
            <p id="loginError" class="a-error" role="alert" aria-live="polite"></p>
        </form>

        <p id="passwordResetSuccess" class="a-success" role="status" aria-live="polite" hidden>ตั้งรหัสผ่านใหม่สำเร็จ กรุณาเข้าสู่ระบบ</p>
        <p class="a-footer">ยังไม่มีบัญชี? <a href="Register.html">สมัครสมาชิก</a></p>
    </main>
</body>
</html>
