<!DOCTYPE html>
<html lang="th">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>งานติดตั้ง | Install</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script type="module" crossorigin src="/Computer-Install/assets/supabase-DfUQ_Pyo.js"></script>
  <script type="module" crossorigin src="/Computer-Install/assets/auth-DNlKMCeC.js"></script>
  <script type="module" crossorigin src="/Computer-Install/assets/dialogs-DbvN5euj.js"></script>
  <script type="module" crossorigin src="/Computer-Install/assets/mvp-mode-B-YfYhvt.js"></script>
  <script type="module" crossorigin src="/Computer-Install/assets/task-store--rq8RDMM.js"></script>
  <script type="module" crossorigin src="/Computer-Install/assets/site-updates-DJQGyy6A.js"></script>
  <script type="module" crossorigin src="/Computer-Install/assets/main-CowaByvX.js"></script>
  <link rel="stylesheet" crossorigin href="/Computer-Install/assets/work-Bo40V8Fk.css">
  <link rel="stylesheet" crossorigin href="/Computer-Install/assets/custom-ClLX-iwM.css">
</head>
<body class="work-page">
	<main class="work-wrap">
		<div class="work-head">
			<a class="work-back" href="services.html">
				<i class="bi bi-arrow-left"></i> กลับหน้ารายการงาน
			</a>
			<h1 id="formTitle">จัดการงานติดตั้ง</h1>
			<p id="taskFormDescription">จัดการงานหลักและรายการงานย่อยตามสิทธิ์ของบัญชี</p>
		</div>

		<section id="taskDetailView" class="work-form" aria-labelledby="formTitle" aria-busy="true" hidden>
			<p id="taskDetailMessage" class="work-message" role="status" aria-live="polite"></p>
			<dl class="work-detail-grid">
				<div><dt>เลขที่งาน</dt><dd id="taskDetailJobNumber">-</dd></div>
				<div><dt>ชื่องาน</dt><dd id="taskDetailJobName">-</dd></div>
				<div><dt>ผู้รับผิดชอบ</dt><dd id="taskDetailOwner">-</dd></div>
				<div><dt>วันที่สร้าง</dt><dd id="taskDetailCreated">-</dd></div>
			</dl>
			<div class="work-items-head">
				<h2>รายการงานย่อย</h2>
				<a id="addInstallItemLink" class="btn btn-primary" href="#" hidden>เพิ่มรายการย่อย</a>
			</div>
			<div id="installItemsList" class="work-items-list" aria-live="polite"></div>
			<div class="work-actions">
				<a id="editInstallLink" class="btn light-button" href="#" hidden>แก้ไขงานหลัก</a>
				<button id="archiveInstallButton" class="btn btn-danger" type="button" hidden>เก็บถาวรงานหลัก</button>
				<button id="restoreInstallButton" class="btn btn-primary" type="button" hidden>กู้คืนงานหลัก</button>
			</div>
		</section>

		<form id="taskForm" class="work-form" novalidate hidden>
			<section id="installHeaderFields">
				<h2>ข้อมูลงานหลัก</h2>
				<div class="work-row">
					<div class="work-field">
						<label for="jobNumber">เลขที่งาน</label>
						<input id="jobNumber" name="jobNumber" type="text" required>
					</div>
					<div class="work-field">
						<label for="jobName">ชื่องาน</label>
						<input id="jobName" name="jobName" type="text">
					</div>
				</div>
				<div class="work-field">
					<label for="ownerName">ผู้รับผิดชอบ (ถ้ามี)</label>
					<input id="ownerName" name="ownerName" type="text">
				</div>
			</section>

			<section id="installSummary" class="work-summary" hidden>
				<strong id="installSummaryTitle"></strong>
				<a href="services.html">กลับหน้ารายการงาน</a>
			</section>

			<section id="installItemEditors">
				<div class="work-items-head">
					<h2 id="itemEditorTitle">รายการงานย่อย</h2>
					<button id="addInstallItemButton" class="btn light-button" type="button">เพิ่มรายการย่อย</button>
				</div>
				<div id="installItemEditorList"></div>
			</section>

			<p id="taskFormMessage" class="work-message" role="alert" aria-live="polite"></p>
			<div class="work-actions">
				<a class="btn light-button" href="services.html">ยกเลิก</a>
				<button id="saveButton" class="btn btn-primary" type="submit">บันทึกงาน</button>
			</div>
		</form>
	</main>

	<template id="installItemEditorTemplate">
		<fieldset class="work-item-editor" data-install-item>
			<legend>รายการงานย่อย <span data-item-number></span></legend>
			<button class="work-item-remove" type="button" data-remove-item hidden>นำรายการนี้ออก</button>
			<div class="work-row">
				<div class="work-field">
					<label data-label="departmentId">แผนก</label>
					<select data-field="departmentId">
						<option value="">ไม่ระบุแผนก</option>
					</select>
				</div>
				<div class="work-field">
					<label data-label="assetIdentifier">Serial Number</label>
					<input data-field="assetIdentifier" type="text">
				</div>
			</div>
			<div class="work-field">
				<label data-label="detail">รายละเอียดงาน</label>
				<textarea data-field="detail" required></textarea>
			</div>
			<div class="work-row">
				<div class="work-field">
					<label data-label="openedAt">วันที่แจ้ง</label>
					<input data-field="openedAt" type="date" required>
				</div>
				<div class="work-field">
					<label data-label="dueAt">วันที่จัดส่ง</label>
					<input data-field="dueAt" type="date">
				</div>
			</div>
			<div class="work-field">
				<label data-label="priority">ความสำคัญ</label>
				<select data-field="priority" required>
					<option value="low">ต่ำ</option>
					<option value="medium" selected>ปกติ</option>
					<option value="high">สูง</option>
				</select>
			</div>
		</fieldset>
	</template>

</body>
</html>
